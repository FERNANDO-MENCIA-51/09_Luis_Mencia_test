name: Docker Hub - Luis Mencia

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

jobs:
  dockerhub:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/09-luis-mencia
          tags: |
            type=raw,value=1.0
            type=raw,value=latest
            type=sha,prefix={{branch}}-

      - name: Build and Push Docker Image to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          dockerfile: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/09-luis-mencia:latest
          cache-to: type=inline

      - name: Check Image Size
        run: |
          IMAGE_SIZE=$(docker image inspect ${{ secrets.DOCKER_USERNAME }}/09-luis-mencia:1.0 --format='{{.Size}}' | awk '{print $1/1024/1024}')
          echo "Tamaño de la imagen: ${IMAGE_SIZE} MB"

      - name: Deployment Summary
        run: |
          echo "### Despliegue Exitoso" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Imagen:** \`${{ secrets.DOCKER_USERNAME }}/09-luis-mencia:1.0\`" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:** latest, 1.0" >> $GITHUB_STEP_SUMMARY
