version: '3.8'

services:
  authentication-service:
    image: 09-luis-mencia:1.0
    container_name: auth-service
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-5002}:${PORT:-5002}"
    environment:
      # Configuración del servidor
      PORT: ${PORT:-5002}
      
      # Configuración de base de datos Neon PostgreSQL
      DATABASE_URL: ${DATABASE_URL:-r2dbc:postgresql://ep-plain-sound-a14svv9-pooler.us-east-1.aws.neon.tech:5432/ms-authenticationService?sslmode=require&preparedStatementCacheQueries=0&connectTimeout=30000}
      DB_USERNAME: ${DB_USERNAME:-neondb_owner}
      DB_PASSWORD: ${DB_PASSWORD:-npg_HFo2ij7rgRbN}
      
      # Configuración JWT
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-here-min-256-bits-change-in-production}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-86400000}
      
      # JVM Options
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+UseG1GC"
    
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${PORT:-5002}/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s
    
    restart: unless-stopped
    
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
